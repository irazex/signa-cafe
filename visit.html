  <h1>Visit Signa Cafe — map, hours and contact, Nusa Dua, Bali</h1>
  <h2>Find us</h2>
  <p>
    <b>Signa Cafe</b>, Jl. Dharmawangsa, Jl. Raya Kampial, Benoa, Nusa Dua, Bali 80361.
    Open 08:00–23:00 every day; kitchen closes 22:30; pizza from 14:00.
    Phone and WhatsApp <a href="tel:+6289654027190">+62 896 540 27190</a>,
    email <a href="mailto:hi@signa.cafe">hi@signa.cafe</a>,
    Instagram <a href="https://www.instagram.com/signa.cafe/">@signa.cafe</a>.
    Google rating 4.7 from 1426+ reviews. Free parking, free WiFi, pet-friendly terrace.
    Ten minutes from Ungasan, fifteen from Jimbaran, on the Bukit peninsula in Benoa.
  </p>
  <h2>Questions people ask</h2>
  <ul>
    <li><b>Is it a good spot to work or meet?</b> Absolutely. A relaxed room that works for solo laptop sessions, friends and groups alike.</li>
    <li><b>Vegetarian or vegan options?</b> Many. Most breakfast, salad, pasta, bakery and pizza items have plant-based versions. Ask the waiter — we'll point them out.</li>
    <li><b>WiFi for working?</b> Free fast WiFi. Outlets at most tables. It's a popular spot for laptops — especially weekday mornings.</li>
    <li><b>Parking?</b> Free parking on-site. Motorbikes and cars.</li>
    <li><b>Pets?</b> Outdoor seating is pet-friendly. Water bowls available.</li>
    <li><b>Book a table?</b> Walk-ins always welcome. For groups of 4+ or a specific time slot, WhatsApp the manager. We hold tables for 15 minutes.</li>
    <li><b>Delivery?</b> GoFood, GrabFood, or directly via signa.dishi.rest. In-house ordering is the fastest.</li>
    <li><b>Pizza all day?</b> Pizza opens at 14:00 — the oven needs the morning to come up to temperature. Everything else is all day, 08:00–23:00.</li>
  </ul>
  <h2>Ordering and delivery</h2>
  <p>
    Order online at <a href="https://signa.dishi.rest/">https://signa.dishi.rest/</a>, or through GoFood and GrabFood.
    Walk-ins are always welcome; for groups of four or more, WhatsApp the manager.
  </p>
