  <h1>Signa Cafe — a neighbourhood all-day cafe in Nusa Dua, Bali</h1>
  <p>
    Family-run since 2024. Specialty coffee, pizza, fresh pasta, all-day breakfast
    and an in-house bakery on Jl. Raya Kampial in Benoa, Nusa Dua — the Bukit peninsula,
    minutes from Ungasan, Jimbaran and Tanjung Benoa. Work-friendly tables, free fast WiFi,
    free parking. Eat. Meet. Create.
  </p>
  <h2>Find us</h2>
  <p>
    <b>Signa Cafe</b>, Jl. Dharmawangsa, Jl. Raya Kampial, Benoa, Nusa Dua, Bali 80361.
    Open 08:00–23:00 every day; kitchen closes 22:30; pizza from 14:00.
    Phone and WhatsApp <a href="tel:+6289654027190">+62 896 540 27190</a>,
    email <a href="mailto:hi@signa.cafe">hi@signa.cafe</a>,
    Instagram <a href="https://www.instagram.com/signa.cafe/">@signa.cafe</a>.
    Google rating 4.7 from 1426+ reviews. Free parking, free WiFi, pet-friendly terrace.
    Ten minutes from Ungasan, fifteen from Jimbaran, on the Bukit peninsula in Benoa.
  </p>
  <h2>On the menu</h2>
  <ul>
    <li><b>Syrniki — cottage cheese pancakes</b> — 93k IDR. Cottage cheese pancakes with sour cream, salted caramel and berries.</li>
    <li><b>Big Breakfast</b> — 79k IDR. Eggs, sausage, hashbrowns, beans, toast — the full plate.</li>
    <li><b>Best Scramble</b> — 71k IDR. Creamy scrambled eggs with fresh herbs and sourdough toast.</li>
    <li><b>Avo Benedict Toast</b> — 65k IDR. Sourdough, smashed avocado, poached eggs, hollandaise.</li>
    <li><b>French Omelette</b> — 75k IDR. Classic French folded omelette with herbs.</li>
    <li><b>Creamy Bacon Pasta</b> — 89k IDR. Penne in cream sauce with crispy bacon and parmesan.</li>
    <li><b>Big Salmon Poke Bowl</b> — 145k IDR. Salmon, rice, edamame, mango, avocado, sesame, soy.</li>
    <li><b>Caesar with chicken</b> — 92k IDR. Grilled chicken, romaine, parmesan, anchovy dressing, croutons.</li>
    <li><b>Mango smoothie bowl</b> — 86k IDR. Mango, banana, coconut milk, chia, granola, fresh fruit.</li>
    <li><b>Norwegian salmon soup</b> — 89k IDR. Creamy salmon soup with potato, leek, dill.</li>
    <li><b>Classic Burger</b> — 80k IDR. Beef patty, cheddar, lettuce, tomato, signa sauce, brioche.</li>
    <li><b>Napoleon cake with Nutella</b> — 85k IDR. Flaky layers, vanilla cream and a generous Nutella swirl.</li>
  </ul>
  <h2>Regular offers</h2>
  <ul>
    <li><b>Free coffee with any order</b> (FROM 08:00 TILL 09:00) — Every day, the first hour after we open. Order anything and your coffee is on the house — espresso-based, hot or iced.</li>
    <li><b>Pizza for 89.000 IDR</b> (EVERY DAY · 14:00–18:00) — Great pizza, great price. One fixed-price pie every afternoon — on Italian flour, baked in-house.</li>
    <li><b>Bakery desserts −30%</b> (EVERY DAY · 21:00–23:00) — Napoleon, eclair, tarts and the rest of the case — thirty percent off in the last two hours before close.</li>
    <li><b>Buy 2 cocktails, 3rd free</b> (MON–THU) — Order two cocktails Monday through Thursday — the third one is on us. Mix and match.</li>
    <li><b>Buy 2 wines, 3rd glass free</b> (SAT &amp; SUN) — Make weekend brunches longer. Two glasses ordered together, the third one's on the house.</li>
    <li><b>20% off your entire order</b> (BIRTHDAY · LOYALTY MEMBERS) — Celebrate at Signa — show your loyalty card on your birthday for 20% off the whole bill. Bring whoever you like.</li>
    <li><b>Earn cashback every day</b> (EVERY ORDER · LOYALTY MEMBERS) — 0–2M IDR → 0%. 2–10M IDR → 5%. Over 10M → 10%. Cashback can cover up to 50% of your next order.</li>
  </ul>
  <h2>Questions people ask</h2>
  <ul>
    <li><b>Is it a good spot to work or meet?</b> Absolutely. A relaxed room that works for solo laptop sessions, friends and groups alike.</li>
    <li><b>Vegetarian or vegan options?</b> Many. Most breakfast, salad, pasta, bakery and pizza items have plant-based versions. Ask the waiter — we'll point them out.</li>
    <li><b>WiFi for working?</b> Free fast WiFi. Outlets at most tables. It's a popular spot for laptops — especially weekday mornings.</li>
    <li><b>Parking?</b> Free parking on-site. Motorbikes and cars.</li>
    <li><b>Pets?</b> Outdoor seating is pet-friendly. Water bowls available.</li>
    <li><b>Book a table?</b> Walk-ins always welcome. For groups of 4+ or a specific time slot, WhatsApp the manager. We hold tables for 15 minutes.</li>
    <li><b>Delivery?</b> GoFood, GrabFood, or directly via signa.dishi.rest. In-house ordering is the fastest.</li>
    <li><b>Pizza all day?</b> Pizza opens at 14:00 — the oven needs the morning to come up to temperature. Everything else is all day, 08:00–23:00.</li>
  </ul>
